<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="images/logo/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
<link rel="stylesheet" href="css/responsive.css">
<title>Gallery — My Art Gallery</title>
</head>
<body data-page="gallery">
<header id="site-header"></header>

<main class="page-top">
  <div class="container">
    <div class="gallery-head">
      <p class="eyebrow">The Collection</p>
      <h1>Gallery</h1>
    </div>

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    </div>

    <div class="masonry" id="gallery-grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <h2>No artworks found</h2>
      <p>Try a different search or category.</p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="js/site-config.js"></script>
<script src="js/artworks.js"></script>
<script src="js/categories.js"></script>
<script src="js/main.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
