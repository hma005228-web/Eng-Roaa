<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="images/logo/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
<link rel="stylesheet" href="css/responsive.css">
<title>Artwork — My Art Gallery</title>
</head>
<body data-page="artwork">
<header id="site-header"></header>

<main class="page-top">
  <div class="container" id="artwork-root"></div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen view">
  <button class="lb-btn" id="lb-close" aria-label="Close">&times;</button>
  <button class="lb-btn" id="lb-prev" aria-label="Previous artwork">&#8249;</button>
  <img id="lightbox-img" alt="">
  <button class="lb-btn" id="lb-next" aria-label="Next artwork">&#8250;</button>
</div>

<footer id="site-footer"></footer>
<script src="js/site-config.js"></script>
<script src="js/artworks.js"></script>
<script src="js/categories.js"></script>
<script src="js/main.js"></script>
<script src="js/artwork.js"></script>
</body>
</html>
